services:
  # ============================================================================
  # 1. Base de Datos Relacional (PostgreSQL 16)
  # ============================================================================
  aeroferia-db:
    image: postgres:16-alpine
    container_name: aeroferia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeroferia_db}
      POSTGRES_USER: ${POSTGRES_USER:-aeroferia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroferia_dev_secret_pass_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - aeroferia-network
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroferia_user} -d ${POSTGRES_DB:-aeroferia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Capa de Negocio y BFF (Spring Boot 3.4 / Java 21)
  #    *IMPORTANTE: NO expone puertos al host exterior. Solo en red privada.*
  # ============================================================================
  aeroferia-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aeroferia-backend
    restart: unless-stopped
    depends_on:
      aeroferia-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://aeroferia-db:5432/${POSTGRES_DB:-aeroferia_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aeroferia_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aeroferia_dev_secret_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-aeroferia_ultra_secure_jwt_token_secret_2026_rc_aeromodelling_key_minimum_256_bits_length!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@aeroferia.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminAeroFeria2026!}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador General}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-5491100000000}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - aeroferia-network
    expose:
      - 8080

  # ============================================================================
  # 3. Frontend SPA (Angular 19+ / Tailwind CSS)
  # ============================================================================
  aeroferia-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeroferia-frontend
    restart: unless-stopped
    networks:
      - aeroferia-network
    expose:
      - 80

  # ============================================================================
  # 4. Escudo Perimetral y Proxy Inverso (Nginx)
  #    *ÚNICO punto de entrada con puertos mapeados hacia el exterior.*
  # ============================================================================
  aeroferia-proxy:
    image: nginx:alpine
    container_name: aeroferia-proxy
    restart: unless-stopped
    depends_on:
      - aeroferia-backend
      - aeroferia-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    networks:
      - aeroferia-network

networks:
  aeroferia-network:
    name: aeroferia-network
    driver: bridge

volumes:
  pg_data:
    name: aeroferia_pg_data
  uploads_data:
    name: aeroferia_uploads_data
